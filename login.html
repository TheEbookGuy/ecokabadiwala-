<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login • Urban Mining Connect</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="auth-page">

<div class="auth-card">

<a class="brand auth-brand" href="index.html">
<span class="brandmark">♻</span>
<span>Urban Mining Connect</span>
</a>

<div class="eyebrow">SECURE LOGIN</div>

<h1 class="title">Welcome back.</h1>

<p class="subtitle">
Log in as a collector or buyer/recycler to continue.
</p>

<form id="form">

<div class="field">
<label>Email</label>
<input
id="email"
type="email"
required
placeholder="you@example.com">
</div>

<div class="field">
<label>Password</label>
<input
id="password"
type="password"
required
placeholder="Your password">
</div>

<button
type="submit"
class="btn btn-primary"
style="width:100%;margin-top:8px">
Log in
</button>

<div
id="msg"
class="notice"
style="display:none;margin-top:15px">
</div>

</form>

<div class="demo-box">
<b>Account types</b>
<div class="small muted">
Collector → capture and traceability workflow
</div>
<div class="small muted">
Buyer / Recycler → recovery partner console
</div>
</div>

<p
class="small muted"
style="text-align:center;margin-top:18px">

New here?
<a href="signup.html">Create an account</a>

</p>

</div>
</main>


<!-- Keep your existing app.js -->

<script src="app.js"></script>


<!-- Firebase login -->

<script type="module">

import { auth } from "./firebase-config.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const form = document.getElementById("form");
const msgEl = document.getElementById("msg");


form.addEventListener("submit", async (e) => {

    e.preventDefault();

    msgEl.style.display = "none";


    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    try {

        msgEl.textContent = "Logging in...";
        msgEl.style.display = "block";


        // Firebase login
        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user = userCredential.user;

        console.log("Logged in:", user.email);


        msgEl.textContent = "Login successful!";


        // Check if another page was requested
        const next =
            new URLSearchParams(location.search).get("next");


        setTimeout(() => {

            if (next) {

                location.href = next;

            } else {

                location.href = "index.html";

            }

        }, 500);


    } catch (error) {

        console.error("Firebase login error:", error);


        let message = "Invalid email or password.";


        if (error.code === "auth/invalid-credential") {

            message = "Invalid email or password.";

        }

        else if (error.code === "auth/user-not-found") {

            message = "No account found with this email.";

        }

        else if (error.code === "auth/wrong-password") {

            message = "Incorrect password.";

        }

        else if (error.code === "auth/invalid-email") {

            message = "Please enter a valid email.";

        }

        else if (error.code === "auth/too-many-requests") {

            message =
                "Too many login attempts. Please try again later.";

        }

        else if (error.code === "auth/operation-not-allowed") {

            message =
                "Email/Password login is not enabled in Firebase.";

        }


        msgEl.textContent = message;
        msgEl.style.display = "block";

    }

});

</script>

</body>
</html>

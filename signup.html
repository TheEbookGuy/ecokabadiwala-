<!doctype html>
<html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sign up • Urban Mining Connect</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="auth-page">

<div class="auth-card">

<a class="brand auth-brand" href="index.html">
<span class="brandmark">♻</span>
<span>Urban Mining Connect</span>
</a>

<div class="eyebrow">CREATE ACCOUNT</div>

<h1 class="title">Join the recovery network.</h1>

<p class="subtitle">
Create a Collector account to capture materials, or a Buyer account to manage incoming lots.
</p>


<div class="role-grid">

<button
type="button"
id="collectorRole"
class="role-card selected"
onclick="chooseRole('collector')">

🚚
<b>Collector</b>
<small>Capture, value and hand over lots</small>

</button>


<button
type="button"
id="buyerRole"
class="role-card"
onclick="chooseRole('buyer')">

♻️
<b>Buyer / Recycler</b>
<small>Review incoming lots and manage recovery</small>

</button>

</div>


<form id="form">


<div class="field">

<label>Full name / organization</label>

<input
id="name"
required
placeholder="Your name or business name">

</div>


<div class="grid g2">


<div class="field">

<label>Email</label>

<input
id="email"
type="email"
required
placeholder="you@example.com">

</div>


<div class="field">

<label>Phone</label>

<input
id="phone"
inputmode="tel"
placeholder="Optional">

</div>


</div>


<div class="field">

<label>Password</label>

<input
id="password"
type="password"
minlength="6"
required
placeholder="At least 6 characters">

</div>


<button
type="submit"
class="btn btn-primary"
style="width:100%;margin-top:8px">

Create account

</button>


<div
id="msg"
class="notice"
style="display:none;margin-top:15px">
</div>


</form>


<p
class="small muted"
style="text-align:center;margin-top:18px">

Already registered?

<a href="login.html">Log in</a>

</p>


</div>

</main>


<!-- Keep your existing app.js -->

<script src="app.js"></script>


<!-- Firebase Signup -->

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


let role = "collector";


/* ---------------------------
   SELECT ACCOUNT TYPE
---------------------------- */

window.chooseRole = function(selectedRole) {

    role = selectedRole;

    document
        .getElementById("collectorRole")
        .classList.toggle(
            "selected",
            role === "collector"
        );

    document
        .getElementById("buyerRole")
        .classList.toggle(
            "selected",
            role === "buyer"
        );

};


/* ---------------------------
   CREATE ACCOUNT
---------------------------- */

document
.getElementById("form")
.addEventListener("submit", async function(e) {

    e.preventDefault();


    const msgEl =
        document.getElementById("msg");


    msgEl.style.display = "none";


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    /* Basic validation */

    if (!name) {

        msgEl.textContent =
            "Please enter your name.";

        msgEl.style.display = "block";

        return;
    }


    if (!email) {

        msgEl.textContent =
            "Please enter your email.";

        msgEl.style.display = "block";

        return;
    }


    if (password.length < 6) {

        msgEl.textContent =
            "Password must contain at least 6 characters.";

        msgEl.style.display = "block";

        return;
    }


    try {

        msgEl.textContent =
            "Creating your account...";

        msgEl.style.display = "block";


        /* ---------------------------
           FIREBASE AUTHENTICATION
        ---------------------------- */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        console.log(
            "Firebase account created:",
            user.uid
        );


        /* ---------------------------
           SAVE NAME TO AUTH PROFILE
        ---------------------------- */

        await updateProfile(user, {

            displayName: name

        });


        /* ---------------------------
           SAVE USER TO FIRESTORE
        ---------------------------- */

        await setDoc(
            doc(db, "users", user.uid),
            {

                userId: user.uid,

                name: name,

                email: email,

                phone: phone,

                role: role,

                createdAt: serverTimestamp()

            }
        );


        console.log(
            "User information saved to Firestore."
        );


        msgEl.textContent =
            "Account created successfully!";

        msgEl.style.display = "block";


        /* ---------------------------
           REDIRECT
        ---------------------------- */

        setTimeout(function() {

            if (role === "buyer") {

                window.location.href =
                    "console.html";

            } else {

                window.location.href =
                    "index.html";

            }

        }, 1000);


    }


    /* ---------------------------
       SHOW EXACT FIREBASE ERROR
    ---------------------------- */

    catch (error) {

        console.error(
            "FULL FIREBASE ERROR:",
            error
        );


        let message =
            "Could not create account.";


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            message =
                "This email is already registered. Please log in.";

        }


        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            message =
                "Please enter a valid email address.";

        }


        else if (
            error.code ===
            "auth/weak-password"
        ) {

            message =
                "Password must contain at least 6 characters.";

        }


        else if (
            error.code ===
            "auth/operation-not-allowed"
        ) {

            message =
                "Email/Password authentication is disabled in Firebase.";

        }


        else if (
            error.code ===
            "auth/network-request-failed"
        ) {

            message =
                "Network error. Please check your internet connection.";

        }


        else if (
            error.code ===
            "permission-denied"
        ) {

            message =
                "Firestore permission denied. Check your Firestore rules.";

        }


        else {

            /*
              Show the actual Firebase error.
              This will help us diagnose
              any remaining problem.
            */

            message =
                error.code +
                " : " +
                error.message;

        }


        msgEl.textContent = message;

        msgEl.style.display = "block";

    }

});

</script>

</body>
</html>

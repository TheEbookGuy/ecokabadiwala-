<!doctype html>
<html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sign up • Urban Mining Connect</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="auth-page">

<div class="auth-card">

<a class="brand auth-brand" href="index.html">
<span class="brandmark">♻</span>
<span>Urban Mining Connect</span>
</a>

<div class="eyebrow">CREATE ACCOUNT</div>

<h1 class="title">Join the recovery network.</h1>

<p class="subtitle">
Create a Collector account to capture materials, or a Buyer account to manage incoming lots.
</p>

<div class="role-grid">

<button type="button"
id="collectorRole"
class="role-card selected"
onclick="chooseRole('collector')">

🚚
<b>Collector</b>
<small>Capture, value and hand over lots</small>

</button>

<button type="button"
id="buyerRole"
class="role-card"
onclick="chooseRole('buyer')">

♻️
<b>Buyer / Recycler</b>
<small>Review incoming lots and manage recovery</small>

</button>

</div>

<form id="form">

<div class="field">
<label>Full name / organization</label>
<input id="name"
required
placeholder="Your name or business name">
</div>

<div class="grid g2">

<div class="field">
<label>Email</label>
<input id="email"
type="email"
required
placeholder="you@example.com">
</div>

<div class="field">
<label>Phone</label>
<input id="phone"
inputmode="tel"
placeholder="Optional">
</div>

</div>

<div class="field">
<label>Password</label>
<input id="password"
type="password"
minlength="6"
required
placeholder="At least 6 characters">
</div>

<button
type="submit"
class="btn btn-primary"
style="width:100%;margin-top:8px">

Create account

</button>

<div id="msg"
class="notice"
style="display:none;margin-top:15px">
</div>

</form>

<p class="small muted"
style="text-align:center;margin-top:18px">

Already registered?
<a href="login.html">Log in</a>

</p>

</div>

</main>


<script src="app.js"></script>


<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


let role = "collector";


window.chooseRole = function(r) {

    role = r;

    document
    .getElementById("collectorRole")
    .classList.toggle("selected", r === "collector");

    document
    .getElementById("buyerRole")
    .classList.toggle("selected", r === "buyer");

};


document
.getElementById("form")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const msg = document.getElementById("msg");

    msg.style.display = "block";

    msg.textContent = "Creating Firebase account...";


    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("password").value;


    try {

        /* ==========================
           STEP 1: CREATE AUTH ACCOUNT
        ========================== */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user = credential.user;


        console.log(
            "AUTHENTICATION SUCCESS:",
            user.uid
        );


        msg.textContent =
            "Authentication successful. Saving user information...";


        /* ==========================
           STEP 2: UPDATE NAME
        ========================== */

        await updateProfile(user, {

            displayName: name

        });


        console.log("NAME SAVED TO AUTH PROFILE");


        /* ==========================
           STEP 3: SAVE TO FIRESTORE
        ========================== */

        await setDoc(
            doc(db, "users", user.uid),
            {

                userId: user.uid,

                name: name,

                email: email,

                phone: phone,

                role: role,

                createdAt: serverTimestamp()

            }
        );


        console.log(
            "FIRESTORE SUCCESS:",
            user.uid
        );


        msg.textContent =
            "Account created and information saved successfully!";


        /* ==========================
           STEP 4: REDIRECT
        ========================== */

        setTimeout(() => {

            if (role === "buyer") {

                window.location.href =
                    "console.html";

            } else {

                window.location.href =
                    "index.html";

            }

        }, 1200);


    } catch (error) {

        console.error(
            "FIREBASE ERROR:",
            error
        );


        msg.style.display = "block";


        msg.textContent =
            "ERROR: " +
            error.code +
            " — " +
            error.message;

    }

});

</script>

</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up • Urban Mining Connect</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="auth-page">

<div class="auth-card">

<a class="brand auth-brand" href="index.html">
<span class="brandmark">♻</span>
<span>Urban Mining Connect</span>
</a>

<div class="eyebrow">CREATE ACCOUNT</div>

<h1 class="title">Join the recovery network.</h1>

<p class="subtitle">
Create a Collector account to capture materials, or a Buyer account to manage incoming lots.
</p>


<div class="role-grid">

<button
type="button"
id="collectorRole"
class="role-card selected"
onclick="chooseRole('collector')">

🚚
<b>Collector</b>
<small>Capture, value and hand over lots</small>

</button>


<button
type="button"
id="buyerRole"
class="role-card"
onclick="chooseRole('buyer')">

♻️
<b>Buyer / Recycler</b>
<small>Review incoming lots and manage recovery</small>

</button>

</div>


<form id="form">

<div class="field">

<label>Full name / organization</label>

<input
id="name"
required
placeholder="Your name or business name">

</div>


<div class="grid g2">

<div class="field">

<label>Email</label>

<input
id="email"
type="email"
required
placeholder="you@example.com">

</div>


<div class="field">

<label>Phone</label>

<input
id="phone"
inputmode="tel"
placeholder="Optional">

</div>

</div>


<div class="field">

<label>Password</label>

<input
id="password"
type="password"
minlength="6"
required
placeholder="At least 6 characters">

</div>


<button
type="submit"
class="btn btn-primary"
style="width:100%;margin-top:8px">

Create account

</button>


<div
id="msg"
class="notice"
style="display:none;margin-top:15px">
</div>

</form>


<p
class="small muted"
style="text-align:center;margin-top:18px">

Already registered?
<a href="login.html">Log in</a>

</p>

</div>

</main>


<!-- Your existing app.js stays unchanged -->
<script src="app.js"></script>


<!-- Firebase Signup -->
<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


let role = "collector";


/* =========================
   ACCOUNT TYPE
========================= */

window.chooseRole = function(selectedRole) {

    role = selectedRole;

    document
        .getElementById("collectorRole")
        .classList.toggle(
            "selected",
            role === "collector"
        );

    document
        .getElementById("buyerRole")
        .classList.toggle(
            "selected",
            role === "buyer"
        );
};


/* =========================
   SIGNUP
========================= */

document
    .getElementById("form")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const msg =
            document.getElementById("msg");


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        msg.style.display = "block";
        msg.textContent = "Creating account...";


        try {

            /* =========================
               1. CREATE AUTH ACCOUNT
            ========================= */

            const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            console.log(
                "Firebase Auth account created:",
                user.uid
            );


            /* =========================
               2. SAVE NAME TO PROFILE
            ========================= */

            await updateProfile(user, {
                displayName: name
            });


            /* =========================
               3. SAVE USER TO FIRESTORE
            ========================= */

            await setDoc(
                doc(db, "users", user.uid),
                {
                    userId: user.uid,
                    name: name,
                    email: email,
                    phone: phone,
                    role: role,
                    createdAt: serverTimestamp()
                }
            );


            console.log(
                "Firestore user document created."
            );


            /* =========================
               4. SUCCESS
            ========================= */

            msg.textContent =
                "Account created successfully!";


            /* =========================
               5. REDIRECT
            ========================= */

            setTimeout(function() {

                if (role === "buyer") {

                    window.location.href =
                        "console.html";

                } else {

                    window.location.href =
                        "index.html";

                }

            }, 1000);


        } catch (error) {

            console.error(
                "Signup error:",
                error
            );


            let errorMessage =
                "Could not create account.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                errorMessage =
                    "This email is already registered. Please log in.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                errorMessage =
                    "Please enter a valid email address.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                errorMessage =
                    "Password must contain at least 6 characters.";

            }

            else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                errorMessage =
                    "Email/Password authentication is disabled in Firebase.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                errorMessage =
                    "Network connection failed. Please try again.";

            }

            else if (
                error.code ===
                "permission-denied" ||
                error.code ===
                "firestore/permission-denied"
            ) {

                errorMessage =
                    "Account created, but Firestore permission was denied. Check Firestore Rules.";

            }

            else {

                errorMessage =
                    error.code +
                    " — " +
                    error.message;

            }


            msg.textContent =
                errorMessage;

            msg.style.display =
                "block";

        }

    });

</script>

</body>
</html>
